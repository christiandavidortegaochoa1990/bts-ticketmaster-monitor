name: BTS Ticketmaster Monitor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - test-alert
          - test-heartbeat

permissions:
  contents: write

concurrency:
  group: bts-ticketmaster-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_PRIORITY: urgent
          NTFY_TAGS: rotating_light,ticket
          HEARTBEAT_ENABLED: "true"
          HEARTBEAT_INTERVAL_MINUTES: "60"
          GITHUB_ACTIONS_MODE: "true"
        run: |
          MODE="${{ github.event.inputs.mode || 'check' }}"
          echo "Running mode: $MODE"

          if [ "$MODE" = "test-alert" ]; then
            python main.py --test-alert
          elif [ "$MODE" = "test-heartbeat" ]; then
            python main.py --test-heartbeat
          else
            python main.py --check-once
          fi

      - name: Commit state changes
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
